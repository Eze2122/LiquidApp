name: RevenueCat integration checks

on:
  pull_request:
    branches:
      - liquidapp-update-1.0.3-admob
  push:
    branches:
      - liquidapp-revenuecat-integration

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies and reconcile lockfile
        run: yarn install --non-interactive
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android
