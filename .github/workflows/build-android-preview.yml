name: Build LiquidApp Android APK with GitHub Actions (Standalone v107)

on:
  workflow_dispatch:
  push:
    branches:
      - liquidapp-revenuecat-integration

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: liquidapp-revenuecat-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Generate native Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Bundle JavaScript for standalone APK
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build debug APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidapp-v107-standalone-bundle-r1
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
