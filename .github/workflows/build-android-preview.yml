name: Build LiquidApp Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - liquidapp-revenuecat-integration

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: liquidapp-revenuecat-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Check EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub repository Actions secrets before running this workflow."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Start Android preview APK build
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
