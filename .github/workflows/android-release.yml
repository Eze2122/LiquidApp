name: LiquidApp - Android Release (AAB firmado)

# Compilación de PRODUCCIÓN fuera de Emergent.
# Usa `eas build --local`: el AAB se compila en el runner de GitHub (NO consume
# créditos de EAS ni de Emergent) y se firma con TU clave de carga tomada de
# GitHub Secrets. Disparo manual para no compilar sin querer.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí "build" para confirmar la compilación de producción'
        required: true
        default: ''

jobs:
  build-aab:
    if: ${{ github.event.inputs.confirm == 'build' }}
    runs-on: ubuntu-latest
    env:
      AAB_OUT: LiquidApp-1.0.2-106.aab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies (reproducible)
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Materializar eas.json
        working-directory: frontend
        run: cp eas.example.json eas.json

      - name: Decodificar keystore de carga (desde Secret)
        working-directory: frontend
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks || { echo "ERROR: keystore vacío. Revisá el secret ANDROID_KEYSTORE_BASE64"; exit 1; }

      - name: Generar credentials.json (desde Secrets, no se commitea)
        working-directory: frontend
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("credentials.json",JSON.stringify({android:{keystore:{keystorePath:"upload-keystore.jks",keystorePassword:process.env.KS_PASS,keyAlias:process.env.KEY_ALIAS,keyPassword:process.env.KEY_PASS}}},null,2))'

      - name: Instalar EAS CLI
        run: npm i -g eas-cli

      - name: Compilar AAB de producción (local, firmado con tu clave)
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/$AAB_OUT"

      - name: Verificar AAB (package / versiones / certificado)
        run: |
          curl -sL -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo "===== MANIFEST ====="
          java -jar bundletool.jar dump manifest --bundle="$GITHUB_WORKSPACE/$AAB_OUT" \
            | grep -Eo 'package="[^"]+"|android:versionCode="[0-9]+"|android:versionName="[^"]+"' || true
          echo "===== CERTIFICADO (debe coincidir con tu clave de carga) ====="
          keytool -printcert -jarfile "$GITHUB_WORKSPACE/$AAB_OUT" | grep -iE "SHA-?256:|SHA-?1:" || true
          echo
          echo "Esperado: package=com.liquidapp.app  versionName=1.0.2  versionCode=106"
          echo "Esperado SHA-256: F6:A7:36:E4:11:89:E3:90:68:06:58:E1:61:83:49:88:54:69:8A:EE:78:A7:90:09:4E:B9:AA:D3:77:91:E3:21"

      - name: Limpiar secretos del runner
        if: always()
        working-directory: frontend
        run: rm -f upload-keystore.jks credentials.json

      - name: Publicar AAB como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: LiquidApp-AAB
          path: ${{ env.AAB_OUT }}
          if-no-files-found: error
